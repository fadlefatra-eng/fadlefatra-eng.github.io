<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Little Photo Booth</title>
<!-- The home page of fadlefatra-eng.github.io. Google takes a site's name and icon from this page (not from
     /photo-booth/), so it says clearly what the site is called. The booth itself stays at /photo-booth/. -->
<meta name="description" content="A free online photo booth for two ♡ Take cute photo strips with frames, or take photos together from two phones in a live room. Photos stay on your device.">
<link rel="canonical" href="https://fadlefatra-eng.github.io/">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFE9F0">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Our Little Photo Booth">
<meta property="og:title" content="Our Little Photo Booth">
<meta property="og:description" content="A free online photo booth for two ♡ Take cute photo strips with frames, or take photos together from two phones in a live room. Photos stay on your device.">
<meta property="og:url" content="https://fadlefatra-eng.github.io/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Our Little Photo Booth",
  "alternateName": ["Our Booth", "Our Little Booth"],
  "url": "https://fadlefatra-eng.github.io/"
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush-100:#FFE9F0; --pink-400:#FF8FB3; --rose-600:#E14F7A; --rose-800:#93264F; --plum-900:#3B1626;
    --shadow-pink:0 18px 40px -18px rgba(147,38,79,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Poppins','Segoe UI',system-ui,sans-serif; color:var(--plum-900);
    background:radial-gradient(900px 520px at 0% 0%,#FFE1EC,transparent 60%),radial-gradient(800px 520px at 100% 10%,#EFE3FF,transparent 60%),#FFF3F7;
  }
  main{min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px 24px;}
  .icon{width:96px; height:96px; display:block;}
  .script{font-family:'Dancing Script',cursive; color:var(--rose-600); font-size:1.45rem; margin:16px 0 0;}
  h1{font-family:'Playfair Display',Georgia,serif; color:var(--rose-800); font-size:2.1rem; line-height:1.15; margin:4px 0 12px;}
  p{font-size:.95rem; line-height:1.6; margin:0 0 22px; max-width:340px; opacity:.85;}
  .btn{display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:14px 30px; border-radius:999px;
    background:linear-gradient(135deg,var(--pink-400),var(--rose-600)); color:#fff; font-weight:600; letter-spacing:.04em;
    text-decoration:none; box-shadow:var(--shadow-pink);}
  .btn:focus-visible{outline:3px solid var(--rose-800); outline-offset:3px;}
  .lock{font-size:.82rem; color:var(--rose-800); margin:18px 0 0;}
  .box{margin:auto 0; display:flex; flex-direction:column; align-items:center;}   /* centred; the footer stays below */
  footer{padding-top:36px; font-size:.8rem; color:var(--rose-800); opacity:.85;}
</style>
</head>
<body>
<main>
  <div class="box">
    <img class="icon" src="/favicon.png" width="96" height="96" alt="">
    <div class="script">a free photo booth for two ♡</div>
    <h1>Our Little Photo Booth</h1>
    <p>Take cute photo strips with frames, or take photos together from two phones in a live room.</p>
    <a class="btn" href="/photo-booth/">OPEN THE BOOTH ♡</a>
    <div class="lock">🔒 Photos stay on your device.</div>
  </div>
  <footer>♡ Our Booth · free, no login, made for two.</footer>
</main>
</body>
</html>
